[project]
name = "ragkit"
version = "0.1.0"
description = "Hands-on AI concepts: RAG, retrieval, evaluation and the systems behind them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-text-splitters>=1.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "sentence-transformers>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pre-commit>=4.0"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
